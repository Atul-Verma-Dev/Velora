let done=0, rows=[];
files.forEach(f=>{const img=new Image(); document.getElementById("imgs").appendChild(img); img.onload=()=>{rows.push("OK "+f+" "+img.naturalWidth+"x"+img.naturalHeight); step();}; img.onerror=()=>{rows.push("BROKEN "+f); step();}; img.src="/images/"+f;});
function step(){done++; if(done===files.length){rows.sort(); document.getElementById("out").textContent=rows.join("\n")+"\nTOTAL "+done;}}
</script>
